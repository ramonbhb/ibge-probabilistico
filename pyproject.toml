[project]
name = "probabilistico"
version = "0.1.0"
description = "Linkage probabilístico Censo × CPF com Splink"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "splink>=4.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
py-modules = ["config", "features", "inferir_pais"]
